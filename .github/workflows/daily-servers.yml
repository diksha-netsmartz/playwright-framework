        run: |
          GREP="${{ github.event.inputs.grep }}"
          CMD="HEADLESS=true VIEWPORT_WIDTH=1920 VIEWPORT_HEIGHT=1080 ENV=uat npx playwright test"

          if [ -n "$GREP" ]; then
