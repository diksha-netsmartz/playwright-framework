name: Playwright Tests (Main)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'coreServer2'
        type: choice
        options:
          - coreServer2
          - coreServer1
          - uat
          - staging
      grep:
        description: 'Tag or pattern to filter tests (e.g. @smoke, @reportCenter, leave empty for all)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run All Playwright Tests
    timeout-minutes: 180
    runs-on: ubuntu-latest

    env:
      CI: true
      HEADLESS: 'true'
      VIEWPORT_WIDTH: '1920'
      VIEWPORT_HEIGHT: '1080'
      ENV: ${{ github.event.inputs.environment || 'coreServer2' }}

    steps:
      - name: Checkout repository (main branch)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java (for Allure Report generation)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Browsers and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests (Headless 1920x1080 Desktop)
        env:
          HEADLESS: 'true'
          VIEWPORT_WIDTH: '1920'
          VIEWPORT_HEIGHT: '1080'
        run: |
          GREP="${{ github.event.inputs.grep }}"
          CMD="HEADLESS=true VIEWPORT_WIDTH=1920 VIEWPORT_HEIGHT=1080 npx playwright test"

          if [ -n "$GREP" ]; then
            CMD="$CMD --grep ${GREP}"
          fi

          echo "Executing: $CMD"
          eval $CMD

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure Results & Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: |
            allure-results/
            allure-reports/
          retention-days: 14

      - name: Send Email with Allure Report Attachment
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          ENV: ${{ github.event.inputs.environment || 'coreServer2' }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME || 'testingdata3011@gmail.com' }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD || 'uazx hbyz rwjf arwj' }}
          EMAIL_TO: 'diksha.gupta@netsmartz.com'
        run: node scripts/send-email.js


