name: Syntax Check

on:
  push:
    branches: [ main, diksha-branch ]
  pull_request:

jobs:
  Syntax:
    name: Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run syntax check
        run: npm run check
