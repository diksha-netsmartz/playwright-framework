name: Syntax Check

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# Cancel previous runs if you push new commits to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Syntax:
    name: Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run syntax check
        run: npm run check

      - name: Validate Playwright test files
        run: npx playwright test --list

      - name: Run ESLint
        run: npm run lint

      - name: Validate module tags on all spec files
        run: npm run check:tags
